name: 割安認定中古車レポート 自動生成

on:
  schedule:
    - cron: '0 */2 * * *'    # 2時間ごと（UTC）= JST 毎時 9,11,13,15,17,19,21,23,1,3,5,7時
  workflow_dispatch:           # 手動実行ボタン
  push:
    branches: [main]           # mainへのpushで自動実行

permissions:
  contents: write              # GitHub Pages デプロイ & seen_ids.json コミットに必要

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.12 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: レポートを生成
        env:
          USE_DEMO:          'false'
          USE_MARKET:        'true'
          OUTPUT_PATH:       'output/index.html'
          SEEN_IDS_PATH:     'seen_ids.json'
          REPORT_URL:        'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}'
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py

      - name: seen_ids.json をリポジトリにコミット・プッシュ
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_ids.json || true
          git diff --cached --quiet || git commit -m "🔄 seen_ids 更新 [skip ci]"
          git push origin HEAD:main || true

      - name: GitHub Pages にデプロイ
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          commit_message: '🚗 レポート自動更新 ${{ github.run_id }}'
